<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archery Note v5 試作</title>
<style>
/* ===== トークン ===== */
:root{
  color-scheme:dark;
  --bg:#0e1217; --surface:#151a21; --raised:#1e252e; --mat:#090c10;
  --rule:#2a323d; --rule-strong:#66727f;
  --ink:#eef1f4; --sub:#a9b3bf;
  --accent:#a8c7ac; --on-accent:#0f1a13; --accent-soft:#1c2a22;
  --warn:#e6c46a; --danger:#ff9288; --info:#8fb8ea;
  --zg:#ffe14d; --zr:#f23b3b; --zb:#37a6e0; --zk:#1c1e1c; --zw:#ffffff; --zm:#7b8591;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --gut:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f3f4f1; --surface:#ffffff; --raised:#e7eae6; --mat:#dfe3de;
  --rule:#d3d8d3; --rule-strong:#717d87;
  --ink:#141c24; --sub:#4d5964;
  --accent:#2c6649; --on-accent:#ffffff; --accent-soft:#dfeae3;
  --warn:#7a5c10; --danger:#b3261e; --info:#1f5f9e;
  --zm:#5d6672;
}
:root[data-field="1"]{--bg:#000000; --surface:#0a0c10; --raised:#161b22; --ink:#ffffff; --sub:#d0d7df; --rule:#4a5563; --rule-strong:#8a96a6; --accent:#c2e3c6;}
:root[data-theme=light][data-field="1"]{--bg:#ffffff; --surface:#ffffff; --raised:#e9ecea; --ink:#0a0f14; --sub:#36414c; --rule:#9aa5ae; --rule-strong:#4d5964; --accent:#1c4a35;}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;font-feature-settings:"palt" 0}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 画面の骨格（タブ画面） ===== */
.scr{padding-bottom:calc(84px + var(--safe-b))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px var(--gut) 10px}
.top h1{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:.01em}
.top .date{font-size:14px;color:var(--sub);line-height:1.3}
.txtBtn{white-space:nowrap;min-height:44px;min-width:44px;padding:0 4px;font-size:15px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.backBtn{min-height:48px;padding:0 12px 0 var(--gut);font-size:16px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.backBtn svg,.txtBtn svg,.chev{width:10px;height:16px;flex:none}

/* 区切り: カードではなく、太い罫線つきの見出しと細い罫線の行 */
.sec{padding:0 var(--gut);margin-top:22px}
.secH{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:2px solid var(--ink);padding:9px 0 8px}
.secH h2{font-size:17px;font-weight:700;line-height:1.35}
.secH .aside{font-size:14px;color:var(--sub);text-align:right}
.band{background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
p.fact{font-size:15px;line-height:1.7;color:var(--ink);padding:10px 0 2px}
p.fact + p.fact{padding-top:4px}
p.basis{font-size:14px;line-height:1.65;color:var(--sub);padding:4px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.row .k{font-size:15px;color:var(--sub);flex:none}
.row .v{font-size:16px;font-weight:600;text-align:right;min-width:0}
.row .v small{display:block;font-size:13px;font-weight:400;color:var(--sub);line-height:1.4}
.row.link .v{display:flex;align-items:center;gap:10px}
.row .main{min-width:0;flex:1}
.row .main b{display:block;font-size:16px;font-weight:600;line-height:1.4}
.row .main span{display:block;font-size:14px;color:var(--sub);line-height:1.45}
.go{color:var(--sub);flex:none}

/* 数値 */
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em}
.big small{font-size:17px;font-weight:500;color:var(--sub);margin-left:4px;letter-spacing:0}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.figs.two{grid-template-columns:repeat(2,1fr)}
.fig{padding:10px 0 10px 12px;border-left:1px solid var(--rule)}
.fig:first-child{padding-left:0;border-left:0}
.fig .l{font-size:13px;color:var(--sub);line-height:1.3}
.fig .n{font-size:28px;font-weight:700;line-height:1.2}
.fig .n small{font-size:14px;font-weight:500;color:var(--sub);margin-left:2px}
.fig .d{font-size:13px;color:var(--sub);line-height:1.3}

/* ボタン */
.btn{min-height:48px;padding:0 18px;border-radius:6px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--danger)}
.btnRow{display:flex;gap:10px;padding-top:14px}
.btnRow .btn{flex:1}

/* セグメント: 角の小さい連結ボタン */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden}
.seg button{min-height:44px;font-size:15px;font-weight:600;color:var(--sub);border-left:1px solid var(--rule-strong);padding:0 4px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
/* 画面内の切り替え: 下線タブ */
.utabs{display:flex;gap:0;padding:0 var(--gut);border-bottom:1px solid var(--rule)}
.utabs button{flex:1;min-height:48px;font-size:16px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.utabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
/* 条件の選択 */
.cond{display:grid;grid-template-columns:1.5fr 1fr;gap:0;margin:0 var(--gut);border-bottom:1px solid var(--rule)}
.cond label{display:block;padding:8px 0 0;position:relative}
.cond label + label{border-left:1px solid var(--rule);padding-left:12px}
.cond span{display:block;font-size:13px;color:var(--sub);line-height:1.3}
.pick{appearance:none;-webkit-appearance:none;background:transparent;border:0;width:100%;min-height:44px;font-size:16px;font-weight:600;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.pick option{background:var(--surface);color:var(--ink)}

/* ===== 下部ナビ: 端まで届く平らなバー＋中央の記録キー ===== */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--rule-strong);padding-bottom:var(--safe-b);z-index:20}
.actbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);background:var(--surface);border-top:1px solid var(--rule-strong);z-index:20;padding:10px var(--gut) calc(10px + var(--safe-b))}
.tabbar button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--sub);border-top:3px solid transparent}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current=page]{color:var(--ink);border-top-color:var(--accent)}
.startBand{padding:14px var(--gut) 16px;margin-top:4px}
.startBand .l{font-size:14px;color:var(--sub);line-height:1.3}
.startBand .c{font-size:22px;font-weight:700;line-height:1.35;margin-top:2px}
.startBand .m{font-size:14px;color:var(--sub);line-height:1.45;margin-bottom:12px}
.startBand .btnRow{padding-top:10px}
.startBand .btnRow .btn.pri{flex:1.7;min-height:56px;font-size:17px}
.startBand .btnRow .btn{min-height:56px}

/* ===== グラフ ===== */
svg text{font-family:var(--font);font-variant-numeric:tabular-nums}
.ax{fill:var(--sub);font-size:13px}
.strip{display:grid;gap:2px;align-items:end;padding:10px 0 6px;border-bottom:1px solid var(--rule)}
.strip > div{min-width:0}
.strip div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:74px}
.strip i{display:block;width:100%;background:var(--rule-strong);min-height:2px}
.strip div.hi i{background:var(--accent)}
.strip b{font-size:13px;font-weight:600;line-height:1}
.strip span{font-size:13px;color:var(--sub);line-height:1}

/* ===== スコア表 ===== */
.sc{font-size:17px;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);background:var(--surface)}
.scRow{display:grid;border-bottom:1px solid var(--rule);min-height:38px;align-items:stretch;width:100%;color:inherit}
.sc.p6 .scRow{grid-template-columns:30px repeat(3,minmax(0,1fr)) 6px repeat(3,minmax(0,1fr)) 40px 52px 26px 26px}
.sc.p3 .scRow{grid-template-columns:34px repeat(3,minmax(0,1fr)) 48px 60px 34px 34px}
.sc.edit .scRow{min-height:44px}
.sc.edit .scHead{min-height:28px}
button.scRow{font-size:inherit;font-weight:inherit}
.scRow.ed{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.scRow .gp{background:var(--bg)}
.scRow .cn{font-size:15px;font-weight:600}
.scRow.scHead .r{justify-content:flex-end;padding-right:6px}
.scRow:last-child{border-bottom:0}
.scRow > *{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--rule);position:relative;min-width:0}
.scRow > *:first-child{border-left:0}
.scHead{min-height:28px;font-size:13px;color:var(--sub);background:var(--bg)}
.scRow .en{font-size:14px;color:var(--sub);font-weight:600}
.scRow .c{font-weight:600}
.scRow .c::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:1px}
.c.zg::after{background:var(--zg)} .c.zr::after{background:var(--zr)} .c.zb::after{background:var(--zb)}
.c.zk::after{background:var(--zk);outline:1px solid var(--rule-strong)} .c.zw::after{background:var(--zw);outline:1px solid var(--rule-strong)} .c.zm::after{background:var(--zm)}
.scRow .et{font-weight:700}
.scRow .rt{font-weight:700;justify-content:flex-end;padding-right:6px}
.scRow.cur{background:var(--accent-soft)}
.scRow.cur .en{color:var(--ink)}
.scRow.cur .en::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.scRow .prov{color:var(--sub);font-weight:600}
.c.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.c.next{box-shadow:inset 0 0 0 1px var(--rule-strong)}
.c .man{position:absolute;top:1px;right:3px;font-size:13px;color:var(--warn);font-weight:700;line-height:1}
button.c{font-size:inherit}
.scSub{display:flex;align-items:center;gap:14px;min-height:38px;padding:0 8px 0 10px;border-bottom:1px solid var(--rule-strong);border-top:1px solid var(--rule-strong);margin-top:-1px;background:var(--bg);font-size:14px;color:var(--sub)}
.scSub b{color:var(--ink);font-size:15px;font-weight:700;margin-left:3px}
.scSub .t{margin-left:auto;font-size:18px;font-weight:700;color:var(--ink)}
.scSub .nm{color:var(--ink);font-weight:700;font-size:14px;min-width:74px}
.scSub.total{background:var(--surface)}
.scSub.total .t{font-size:22px}

/* ===== 記録画面（没入・タブなし） ===== */
.rec{height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
.recTop{flex:none;display:flex;align-items:center;justify-content:space-between;height:48px;border-bottom:1px solid var(--rule)}
.recTop .condT{font-size:15px;font-weight:600;text-align:center;line-height:1.25;min-width:0;white-space:nowrap}
.recTop .txtBtn{padding:0 var(--gut);color:var(--ink);min-height:48px}
.recStat{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px var(--gut) 4px}
.recStat .endN{font-size:20px;font-weight:700;line-height:1.25}
.recStat .msg{font-size:14px;color:var(--sub);line-height:1.3;min-height:18px}
.recStat .msg.warn{color:var(--warn)}
.recStat .tot{text-align:right;line-height:1}
.recStat .tot span{font-size:13px;color:var(--sub);margin-right:6px}
.recStat .tot b{font-size:36px;font-weight:700}
.ruler{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:0 var(--gut) 6px}
.ruler i{height:5px;background:var(--rule)}
.ruler i.d{background:var(--sub)}
.ruler i.c{background:var(--accent)}
.tgWrap{flex:none;background:var(--mat);position:relative;display:flex;justify-content:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tgWrap svg{display:block;width:min(100vw,480px,calc(100dvh - 318px));height:auto;aspect-ratio:1;touch-action:none}
.zoomBtn{position:absolute;left:6px;bottom:6px;min-width:64px;height:44px;padding:0 10px;border-radius:6px;background:var(--surface);border:1px solid var(--rule-strong);font-size:14px;font-weight:700;color:var(--ink)}
.lens{position:fixed;top:6px;z-index:40;width:132px;display:none;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.lens.on{display:flex}
.lens.right{right:max(6px,calc(50vw - 234px))}
.lens.left{left:max(6px,calc(50vw - 234px))}
.lens svg{width:132px;height:132px;border-radius:50%;border:2px solid var(--ink);background:#888;display:block}
.lens .read{margin-top:-14px;min-width:92px;padding:3px 10px 4px;border-radius:6px;background:var(--ink);color:var(--bg);text-align:center;font-size:24px;font-weight:700;line-height:1.15}
.lens .read small{display:block;font-size:13px;font-weight:600;line-height:1.2}
.miniCard{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.miniCard .sc{border-top:0}
.miniEmpty{padding:14px var(--gut);font-size:14px;color:var(--sub);line-height:1.6}
.curEnd{flex:none;border-top:2px solid var(--ink);background:var(--surface)}
.curRow{display:grid;height:54px}
.curRow.p6{grid-template-columns:34px repeat(3,minmax(0,1fr)) 6px repeat(3,minmax(0,1fr)) 58px}
.curRow.p3{grid-template-columns:34px repeat(3,minmax(0,1fr)) 58px}
.curRow .gp{background:var(--bg)}
.curCap{display:flex;justify-content:space-between;gap:8px;padding:5px var(--gut) 4px;font-size:14px;color:var(--sub);border-bottom:1px solid var(--rule);line-height:1.3}
.curCap b{color:var(--ink);font-weight:700}
.curRow > *{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--rule);position:relative;font-size:24px;font-weight:700}
.curRow > *:first-child{border-left:0;font-size:15px;color:var(--sub)}
.curRow .slot .ord{position:absolute;top:2px;left:5px;font-size:13px;font-weight:600;color:var(--sub);line-height:1.1}
.curRow .slot::after{content:"";position:absolute;left:18%;right:18%;bottom:5px;height:4px;border-radius:1px}
.slot.zg::after{background:var(--zg)} .slot.zr::after{background:var(--zr)} .slot.zb::after{background:var(--zb)}
.slot.zk::after{background:var(--zk);outline:1px solid var(--rule-strong)} .slot.zw::after{background:var(--zw);outline:1px solid var(--rule-strong)} .slot.zm::after{background:var(--zm)}
.slot.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.slot.next{box-shadow:inset 0 0 0 1px var(--rule-strong)}
.slot .nopos{position:absolute;bottom:11px;right:4px;font-size:13px;color:var(--sub);font-weight:600;line-height:1}
.curRow .sum{flex-direction:column;gap:0;font-size:24px}
.dock{flex:none;display:grid;gap:8px;padding:8px var(--gut) calc(8px + var(--safe-b));border-top:1px solid var(--rule);background:var(--surface)}
.dock.t3{grid-template-columns:76px 92px 1fr}
.dock.t2{grid-template-columns:96px 1fr}
.dock .btn{min-height:52px;padding:0 8px}
.dock .btn small{font-size:13px;font-weight:600;display:block;line-height:1.1}
.dock .btn.col{flex-direction:column;gap:1px;line-height:1.15}
.btn[disabled]{opacity:.42}
.keys{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px var(--gut) 0;background:var(--surface);border-top:2px solid var(--ink)}
.key{height:54px;border-radius:6px;background:var(--raised);border:1px solid var(--rule-strong);font-size:24px;font-weight:700;position:relative;overflow:hidden}
.key::before{content:"";position:absolute;left:0;right:0;top:0;height:6px}
.key.zg::before{background:var(--zg)} .key.zr::before{background:var(--zr)} .key.zb::before{background:var(--zb)}
.key.zk::before{background:var(--zk);border-bottom:1px solid var(--rule-strong)} .key.zw::before{background:var(--zw);border-bottom:1px solid var(--rule-strong)} .key.zm::before{background:var(--zm)}
.key[disabled]{opacity:.38}
.key:active{background:var(--accent-soft)}
.scScroll{flex:1 1 0;min-height:0;overflow-y:auto}
.editBar{flex:none;background:var(--surface);border-top:1px solid var(--rule);padding:8px var(--gut) calc(8px + var(--safe-b))}
.editBar .t{font-size:15px;font-weight:600;line-height:1.4}
.editBar .s{font-size:14px;color:var(--sub);line-height:1.4;margin-bottom:8px}
.nudge{display:grid;grid-template-columns:repeat(4,48px) 1fr 1fr;gap:6px}
.nudge .btn{padding:0;min-height:48px;font-size:15px}
.editKeys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.editKeys .key{height:52px;font-size:20px}

/* シート */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,480px);background:var(--surface);border-top:2px solid var(--ink);padding:6px var(--gut) calc(14px + var(--safe-b))}
.sheet h2{font-size:17px;font-weight:700;padding:10px 0 4px}

/* ノート */
.month{font-size:15px;font-weight:700;padding:16px var(--gut) 6px;border-bottom:2px solid var(--ink);margin:0}
.entry{display:grid;grid-template-columns:54px 1fr;gap:0 10px;padding:12px var(--gut);border-bottom:1px solid var(--rule);width:100%;text-align:left}
.entry .day{font-size:26px;font-weight:700;line-height:1.05}
.entry .day small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:3px}
.entry .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.entry .hd b{font-size:16px;font-weight:600}
.entry .hd .sc1{font-size:24px;font-weight:700;line-height:1.1}
.entry .hd .sc1 small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
.entry .meta{font-size:14px;color:var(--sub);line-height:1.45}
.entry .txt{font-size:15px;line-height:1.6;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry .chg{font-size:14px;color:var(--info);line-height:1.45;margin-top:3px}
.noteBox{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--rule-strong);border-radius:6px;padding:10px 12px;font-size:16px;line-height:1.6;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.tag{font-size:14px;color:var(--sub);border:1px solid var(--rule-strong);border-radius:4px;padding:2px 8px;min-height:28px;display:inline-flex;align-items:center}

/* 比較 */
.cmp{border-top:1px solid var(--rule-strong)}
.cmpRow{display:grid;grid-template-columns:1.25fr 1fr 1fr .9fr;border-bottom:1px solid var(--rule);min-height:42px;align-items:center}
.cmpRow > *{padding:4px 8px 4px 0;font-size:17px;font-weight:700;text-align:right}
.cmpRow > *:first-child{text-align:left;font-size:15px;font-weight:500;color:var(--sub)}
.cmpRow.h > *{font-size:13px;font-weight:600;color:var(--sub)}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Archery Note v5 試作。本番コードとは独立。データは決定的な乱数で作った見本。
   座標は的の中心からの cm（x 右が正、y 上が正）。矢の半径は実寸 2.85mm。
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const qs=new URLSearchParams(location.search);
const settings={theme:qs.get("theme")||"dark",field:qs.get("field")==="1",lens:qs.get("lens")||"right",gamify:false};
function applyTheme(){const r=document.documentElement;r.dataset.theme=settings.theme;if(settings.field)r.dataset.field="1";else delete r.dataset.field}
applyTheme();

/* ---------- 採点（本番 scoreAt と同じ規則: 矢円が線に触れたら高い方） ---------- */
const ARROW_R=0.285, EPS=1e-9;
function scoreAt(x,y,faceD,r=ARROW_R){
  const w=faceD/20, d=Math.max(0,Math.hypot(x,y)-r);
  if(d<=w/2*(1+EPS)) return {s:10,X:true};
  const s=11-Math.ceil(d/w-EPS);
  return {s:s<1?0:Math.min(10,s),X:false};
}
const lab=a=>a.X?"X":a.s===0?"M":String(a.s);
const rank=a=>a.X?11:a.s;
const zone=a=>a.X||a.s>=9?"zg":a.s>=7?"zr":a.s>=5?"zb":a.s>=3?"zk":a.s>=1?"zw":"zm";
const KEYS=[["X",10,1],["10",10],["9",9],["8",8],["7",7],["6",6],["5",5],["4",4],["3",3],["2",2],["1",1],["M",0]];

/* ---------- 見本データ ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
const r2=v=>Math.round(v*100)/100;
function mkSess(o){
  const r=rng(o.seed), ends=[];
  for(let e=0;e<o.endsPlan;e++){const a=[];for(let i=0;i<o.per;i++){
    const x=o.bx+gauss(r)*o.sg, y=o.by+gauss(r)*o.sg*1.12, sc=scoreAt(x,y,o.faceD);
    a.push(o.inputMode==="key"?{x:null,y:null,s:sc.s,X:sc.X,src:"key"}:{x:r2(x),y:r2(y),s:sc.s,X:sc.X,src:"pos"});

  return Object.assign({faceType:"full",arrowR:ARROW_R,setupId:"s1",inputMode:"pos",tags:[],note:""},o,{ends});
}
const DB={
  setups:[{id:"s1",name:"メインリカーブ",active:true,spec:[["ハンドル","25インチ"],["リム","68インチ・38ポンド（実測 36.5）"],["矢","カーボン 620番・28.5インチ"],["矢の外径","5.7mm（線の判定に使います）"],["ポイント","100グレイン"],["ブレースハイト","22.3cm"],["ティラー差","上 +3mm"],["ノッキングポイント","+4mm"],["プランジャー","中間・ばね 中"]]},
          {id:"s2",name:"インドア用",active:false,spec:[["リム","68インチ・36ポンド"],["矢","アルミ 2312"],["矢の外径","9.1mm（線の判定に使います）"]]}],
  gearLog:[{date:"2026-10-28",text:"サイト 70m 5.00 → 5.20"},{date:"2026-10-14",text:"プランジャー ばね 弱 → 中"},{date:"2026-10-03",text:"ノッキングポイント +3mm → +4mm"}],
  marks:[{dist:18,v:1.85,date:"2026-11-01",kind:"実測"},{dist:30,v:2.60,date:"2026-09-20",kind:"実測"},{dist:50,v:3.84,date:null,kind:"予測"},{dist:70,v:5.20,date:"2026-10-28",kind:"実測"}],
  notes:[{id:"n1",date:"2026-11-08",text:"素引き30回。引き手の肘が下がる感覚があったので、鏡で肩の高さを確認しました。",tags:["射型"]}],
  trash:2,
  sessions:[
    mkSess({id:"a1",seed:11,date:"2026-10-03",dist:70,faceD:122,per:6,endsPlan:12,sg:8.6,bx:-2.6,by:-2.0,weather:"晴れ",wind:"弱い",note:"ノッキングポイントを1mm上げた初日。上下のばらつきを見るために72射。"}),
    mkSess({id:"a2",seed:23,date:"2026-10-10",dist:70,faceD:122,per:6,endsPlan:12,sg:8.2,bx:-2.2,by:-1.4,weather:"くもり",wind:"なし",note:""}),
    mkSess({id:"a3",seed:37,date:"2026-10-14",dist:70,faceD:122,per:6,endsPlan:12,sg:8.9,bx:-2.9,by:-0.8,weather:"晴れ",wind:"左から中",note:"左からの風。後半は風上をねらいました。プランジャーのばねを中に変更。",tags:["風"]}),
    mkSess({id:"a4",seed:41,date:"2026-10-21",dist:70,faceD:122,per:6,endsPlan:12,sg:8.0,bx:-2.4,by:-1.2,weather:"晴れ",wind:"なし",note:"リリースで引き手が外に逃げる回が数回。"}),
    mkSess({id:"a5",seed:53,date:"2026-10-28",dist:70,faceD:122,per:6,endsPlan:12,sg:8.3,bx:-2.8,by:-1.0,weather:"晴れ",wind:"弱い",note:"着弾が左に寄っていたため、終了後にサイトを 5.00 から 5.20 に変更。",tags:["サイト"]}),
    mkSess({id:"a6",seed:67,date:"2026-11-04",dist:70,faceD:122,per:6,endsPlan:12,sg:8.1,bx:-0.6,by:-0.9,weather:"雨",wind:"なし",inputMode:"key",note:"雨のため点数だけ記録。"}),
    mkSess({id:"b1",seed:71,date:"2026-11-01",dist:18,faceD:40,per:3,endsPlan:20,sg:1.75,bx:0.2,by:-0.3,weather:"屋内",wind:"なし",setupId:"s2",note:"インドア用の矢で初回。18m のサイト値を記録。",tags:["サイト"]}),
    mkSess({id:"a7",seed:89,date:"2026-11-10",dist:70,faceD:122,per:6,endsPlan:12,sg:7.9,bx:-0.5,by:-0.8,weather:"晴れ",wind:"弱い",note:"サイト変更後の2回目。3エンド目と9エンド目で引き手の肘が下がりました。",tags:["射型"]}),
    mkSess({id:"b2",seed:97,date:"2026-11-07",dist:18,faceD:40,per:3,endsPlan:20,sg:1.65,bx:0.1,by:-0.2,weather:"屋内",wind:"なし",setupId:"s2",note:""})
  ]
};
const TODAY="2026-11-12";
/* ---------- 集計 ---------- */
const flat=s=>s.ends.flat();
const sum=a=>a.reduce((t,x)=>t+x.s,0);
const total=s=>sum(flat(s));
const tens=a=>a.filter(x=>x.s===10).length, xs=a=>a.filter(x=>x.X).length;
const shots=s=>flat(s).length;
const planned=s=>s.per*s.endsPlan;
const halfTot=(s,h)=>{const n=s.endsPlan/2;return sum(s.ends.slice(h*n,(h+1)*n).flat())};
const mean=a=>a.reduce((t,v)=>t+v,0)/a.length;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((t,v)=>t+(v-m)**2,0)/(a.length-1))};
const pos=s=>flat(s).filter(a=>a.x!=null);
function group(arr){ /* 指標A: 全射。rr = sqrt(sxx+syy)（n-1 で割る）。95%区間は Satterthwaite と Wilson–Hilferty */
  const n=arr.length; if(n<3) return null;
  const cx=mean(arr.map(a=>a.x)), cy=mean(arr.map(a=>a.y));
  let sxx=0,syy=0,sxy=0; arr.forEach(a=>{sxx+=(a.x-cx)**2;syy+=(a.y-cy)**2;sxy+=(a.x-cx)*(a.y-cy)});
  sxx/=n-1;syy/=n-1;sxy/=n-1;
  const rr=Math.sqrt(sxx+syy), nu=(n-1)*(sxx+syy)**2/(sxx*sxx+syy*syy+2*sxy*sxy);
  const chi=(p)=>{const z=p===0.975?1.959964:-1.959964;return nu*Math.pow(1-2/(9*nu)+z*Math.sqrt(2/(9*nu)),3)};
  return {n,cx,cy,sx:Math.sqrt(sxx),sy:Math.sqrt(syy),rr,lo:rr*Math.sqrt(nu/chi(0.975)),hi:rr*Math.sqrt(nu/chi(0.025))};
}
const f1=v=>v.toFixed(1), f2=v=>v.toFixed(2);
const sgn=(v,d=0)=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(d);
const WD=["日","月","火","水","木","金","土"];
const dOf=s=>new Date(s+"T00:00:00");
const md=s=>{const d=dOf(s);return (d.getMonth()+1)+"/"+d.getDate()};
const mdw=s=>md(s)+"（"+WD[dOf(s).getDay()]+"）";
const condKey=s=>s.dist+"|"+s.faceD+"|"+planned(s);
const condLabel=s=>`${s.dist}m・${s.faceD}cm的・${planned(s)}射`;
const setupName=id=>(DB.setups.find(s=>s.id===id)||{}).name||"";
const offTxt=g=>{const h=Math.abs(g.cx)<0.05?"左右 0.0":(g.cx<0?"左 ":"右 ")+f1(Math.abs(g.cx)),v=Math.abs(g.cy)<0.05?"上下 0.0":(g.cy<0?"下 ":"上 ")+f1(Math.abs(g.cy));return h+"cm・"+v+"cm"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byDateDesc=(a,b)=>a.date<b.date?1:-1;
const done=()=>DB.sessions.filter(s=>s.ends.length===s.endsPlan);

/* ---------- 的の描画 ---------- */
const ZFILL=["","#ffffff","#ffffff","#1c1e1c","#1c1e1c","#37a6e0","#37a6e0","#f23b3b","#f23b3b","#ffe14d","#ffe14d"];
function faceMarkup(faceD){
  const w=faceD/20; let h="";
  for(let s=1;s<=10;s++){const r=w*(11-s);const line=(s===3)?"#1c1e1c":(s===4)?"#ffffff":"#1c1e1c";
    h+=`<circle r="${r}" fill="${ZFILL[s]}" stroke="${s===1?"#717d87":line}" stroke-width="${s===1?1:0.7}" vector-effect="non-scaling-stroke"/>`}
  h+=`<circle r="${w/2}" fill="none" stroke="#1c1e1c" stroke-width="0.7" vector-effect="non-scaling-stroke"/>`;
  h+=`<path d="M${-w*0.16} 0H${w*0.16}M0 ${-w*0.16}V${w*0.16}" stroke="#1c1e1c" stroke-width="0.7" vector-effect="non-scaling-stroke"/>`;
  return h;
}
const dotFill=(a,faceD)=>{const z=scoreAt(a.x,a.y,faceD,0).s;return (z===3||z===4)?"#ffffff":"#10151b"};
/* 実寸の矢円（判定と同じ半径）＋位置の目印（破線、判定に使わない） */
function arrowDot(a,faceD,k,o={}){
  const loc=Math.max(faceD/85,4.2*k), f=dotFill(a,faceD);
  return `<g opacity="${o.dim?0.5:1}"><circle cx="${a.x}" cy="${-a.y}" r="${loc}" fill="${f==="#ffffff"?"rgba(255,255,255,.16)":"rgba(16,21,27,.16)"}" stroke="${f}" stroke-width="${o.sel?2:1}" ${o.plain?"":'stroke-dasharray="2 2"'} vector-effect="non-scaling-stroke"/><circle cx="${a.x}" cy="${-a.y}" r="${o.r||ARROW_R}" fill="${f}"/></g>`;
}
/* 番号ラベルの重なり回避: 群の重心から外へ出し、ラベル同士と矢の位置から押し離す */
function layoutLabels(pts,k,vb){
  const R=11*k,n=pts.length; if(!n) return [];
  const cx=mean(pts.map(p=>p.x)), cy=mean(pts.map(p=>p.y));
  const L=pts.map((p,i)=>{let dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d<0.2*k){const a=-Math.PI/3+i*2.1;dx=Math.cos(a);dy=Math.sin(a);d=1}return{x:p.x+dx/d*24*k,y:p.y+dy/d*24*k}});
  for(let it=0;it<80;it++){
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let dx=L[j].x-L[i].x,dy=L[j].y-L[i].y,d=Math.hypot(dx,dy),m=2*R+4*k;if(d<m){if(d<1e-6){dx=1;dy=0;d=1}const p=(m-d)/2;L[i].x-=dx/d*p;L[i].y-=dy/d*p;L[j].x+=dx/d*p;L[j].y+=dy/d*p}}
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){let dx=L[i].x-pts[j].x,dy=L[i].y-pts[j].y,d=Math.hypot(dx,dy),m=R+7*k;if(d<m){if(d<1e-6){dx=0;dy=1;d=1}L[i].x+=dx/d*(m-d);L[i].y+=dy/d*(m-d)}}
    for(const l of L){l.x=Math.min(vb.x+vb.w-R-k,Math.max(vb.x+R+k,l.x));l.y=Math.min(-vb.y-R-k,Math.max(-vb.y-vb.h+R+k,l.y))}
  }
  return L;
}
function labelsMarkup(arrs,k,vb,sel){
  const idx=arrs.map((a,i)=>({a,i})).filter(o=>o.a.x!=null), L=layoutLabels(idx.map(o=>o.a),k,vb);
  let lines="",badges="";
  idx.forEach((o,j)=>{const l=L[j],on=sel===o.i;
    lines+=`<path d="M${o.a.x} ${-o.a.y}L${l.x} ${-l.y}" stroke="#ffffff" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M${o.a.x} ${-o.a.y}L${l.x} ${-l.y}" stroke="#10151b" stroke-width="1.25" vector-effect="non-scaling-stroke"/>`;
    badges+=`<g><circle cx="${l.x}" cy="${-l.y}" r="${11*k}" fill="${on?"#a8c7ac":"#10151b"}" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="${l.x}" y="${-l.y}" font-size="${13*k}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${on?"#0f1a13":"#ffffff"}">${o.i+1}</text></g>`});
  return lines+badges;
}
function viewBoxFor(faceD,zoom){const R=faceD/2*(zoom?0.47:1.035);return {x:-R,y:-R,w:2*R,h:2*R}}
/* 集計用の的図: 全矢、着弾中心、RMS の円 */
function plotSvg(sess,px,o={}){
  const vb=viewBoxFor(sess.faceD,false),k=vb.w/px,arr=pos(sess),g=group(arr);
  let h=`<svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" width="${px}" height="${px}" role="img" aria-label="着弾位置の図">${faceMarkup(sess.faceD)}`;
  arr.forEach(a=>h+=arrowDot(a,sess.faceD,k,{plain:true}));
  if(g){const c=9*k;
    h+=`<circle cx="${g.cx}" cy="${-g.cy}" r="${g.rr}" fill="none" stroke="#ffffff" stroke-width="3.5" vector-effect="non-scaling-stroke"/><circle cx="${g.cx}" cy="${-g.cy}" r="${g.rr}" fill="none" stroke="#10151b" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;
    h+=`<path d="M${g.cx-c} ${-g.cy}H${g.cx+c}M${g.cx} ${-g.cy-c}V${-g.cy+c}" stroke="#ffffff" stroke-width="5" vector-effect="non-scaling-stroke"/><path d="M${g.cx-c} ${-g.cy}H${g.cx+c}M${g.cx} ${-g.cy-c}V${-g.cy+c}" stroke="#10151b" stroke-width="2" vector-effect="non-scaling-stroke"/>`}
  return h+"</svg>";
}

/* ---------- スコア表 ---------- */
function scorecard(sess,o={}){
  /* 並びは公認大会で使われる採点用紙を参考: 回 | 3射 | 3射 | 計 | 累計 | 10数(X含む) | X数、36射ごとの小計、総合計 */
  const per=sess.per,N=sess.endsPlan,half=N/2,cur=o.cur,split=per===6;
  const gap=a=>{if(split)a.splice(3,0,'<div class="gp"></div>');return a.join("")};
  let run=0,h=`<div class="sc p${per}${o.edit?" edit":""}" role="table" aria-label="スコア表"><div class="scRow scHead" role="row"><div>回</div>${gap(Array.from({length:per},(_,i)=>`<div>${i+1}</div>`))}<div>計</div><div class="r">累計</div><div title="10点の数（Xを含む）">10</div><div>X</div></div>`;
  const sub=(name,a0,full,cls="")=>`<div class="scSub ${cls}" role="row"><span class="nm">${name}</span><span>10+X<b>${full?tens(a0):"—"}</b></span><span>X<b>${full?xs(a0):"—"}</b></span><span class="t">${full?sum(a0):"—"}</span></div>`;
  for(let e=0;e<N;e++){
    const isDone=e<sess.ends.length,isCur=!isDone&&cur&&e===sess.ends.length;
    if(o.onlyDone&&!isDone) break;
    let arr=(isDone?sess.ends[e]:isCur?cur:[]).slice();
    if(isDone&&o.ed!==e) arr.sort((p,q)=>rank(q)-rank(p)); /* 表示だけ高い点から。保存は打った順 */
    const et=sum(arr); if(isDone) run+=et;
    const tag=o.edit&&isDone?"button":"div";
    const cells=Array.from({length:per},(_,i)=>{const a=arr[i];return a?`<div class="c ${zone(a)}">${lab(a)}${a.manual?'<span class="man" title="手動で修正">*</span>':""}</div>`:`<div class="c${isCur&&i===arr.length?" next":""}"></div>`});
    h+=`<${tag} class="scRow${isCur?" cur":""}${o.ed===e?" ed":""}" role="row" ${isCur?'id="curRowEl"':""} ${tag==="button"?`data-erow="${e}" aria-label="${e+1}エンド 計${et}点。タップで修正"`:""}><div class="en">${e+1}</div>${gap(cells)}`;
    h+=`<div class="et${isCur?" prov":""}">${isDone||(isCur&&arr.length)?et:""}</div><div class="rt${isCur?" prov":""}">${isDone?run:isCur&&arr.length?run+et:""}</div><div class="cn">${isDone?tens(arr):""}</div><div class="cn">${isDone?xs(arr):""}</div></${tag}>`;
    if(!o.onlyDone||isDone){
      if(e===half-1) h+=sub(`前半 ${half*per}射`,sess.ends.slice(0,half).flat(),sess.ends.length>=half);
      if(e===N-1){h+=sub(`後半 ${half*per}射`,sess.ends.slice(half).flat(),sess.ends.length>=N);h+=sub(`合計 ${N*per}射`,flat(sess),sess.ends.length>=N,"total")}
    }
  }
  return h+"</div>";
}
/* 入力中（または修正中）のエンド: 打った順の大きな枠 */
function curRowHtml(arr,per,endNo,sel,o={}){
  const cells=Array.from({length:per},(_,i)=>{const a=arr[i];return a?`<button class="slot ${zone(a)}${sel===i?" sel":""}" data-slot="${i}" aria-label="${i+1}射目 ${lab(a)}。タップで修正"><span class="ord">${i+1}</span>${lab(a)}${a.manual?'<span class="man" style="position:absolute;top:2px;right:4px;font-size:13px;color:var(--warn)">*</span>':""}${o.showNoPos&&a.x==null?'<span class="nopos">位置なし</span>':""}</button>`:`<div class="slot${i===arr.length&&!o.locked?" next":""}"><span class="ord">${i+1}</span></div>`});
  if(per===6) cells.splice(3,0,'<div class="gp"></div>');
  return `<div class="curRow p${per}"><div>${endNo}</div>${cells.join("")}<div class="sum">${arr.length?sum(arr):""}</div></div>`;

/* ---------- グラフ ---------- */
function chartW(){return Math.min(innerWidth,480)-(innerWidth<=340?24:32)}
function lineChart(vals,labels,o={}){
  const W=chartW(),H=o.h||176,L=42,R=24,T=26,B=28;
  let lo=Math.min(...vals),hi=Math.max(...vals);const step=o.step||10;lo=Math.floor((lo-5)/step)*step;hi=Math.ceil((hi+2)/step)*step;if(hi===lo)hi+=step;
  const X=i=>L+14+(vals.length===1?(W-L-R-14)/2:i*(W-L-R-14)/(vals.length-1)),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let h=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${o.label||"推移"}">`;
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=(hi-lo)/((hi-lo)/step>4?2:(hi-lo)/step))ticks.push(v);
  ticks.forEach(v=>{h+=`<path d="M${L} ${Y(v)}H${W-R+10}" stroke="var(--rule)"/><text class="ax" x="${L-8}" y="${Y(v)+4.5}" text-anchor="end">${Math.round(v)}</text>`});
  if(o.mean!=null) h+=`<path d="M${L} ${Y(o.mean)}H${W-R+10}" stroke="var(--sub)" stroke-dasharray="5 4"/>`;
  h+=`<path d="${vals.map((v,i)=>(i?"L":"M")+X(i)+" "+Y(v)).join("")}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  vals.forEach((v,i)=>{const last=i===vals.length-1;h+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${last?5:4}" fill="${last?"var(--accent)":"var(--bg)"}" stroke="${last?"var(--accent)":"var(--ink)"}" stroke-width="2"/>`;
    const nb=[vals[i-1],vals[i+1]].filter(x=>x!=null),below=nb.length&&v<mean(nb);
    h+=`<text x="${X(i)}" y="${below?Y(v)+20:Y(v)-10}" text-anchor="middle" font-size="13" font-weight="${last?700:500}" fill="var(--ink)">${v}</text>`;
    h+=`<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  return h+"</svg>";
}
function endStrip(vals,o={}){
  const lo=Math.min(...vals),hi=Math.max(...vals),best=hi,per=o.rows===2?Math.ceil(vals.length/2):vals.length;
  const cell=(v,i)=>`<div class="${v===best&&o.mark?"hi":""}"><b>${o.fmt?o.fmt(v):v}</b><i style="height:${Math.round(8+(v-lo)/((hi-lo)||1)*30)}px"></i><span>${i+1}</span></div>`;
  let h="";for(let r=0;r*per<vals.length;r++)h+=`<div class="strip" style="grid-template-columns:repeat(${per},1fr)">${vals.slice(r*per,(r+1)*per).map((v,i)=>cell(v,r*per+i)).join("")}</div>`;
  return h;
}

function bindRecTarget(){
  const A=active,s=A.sess,svg=$("#tg"),lens=$("#lens"),lensSvg=$("#lensSvg"),read=$("#lensRead"),ghost=$("#ghost");

  const vb=viewBoxFor(s.faceD,A.zoom), face=faceMarkup(s.faceD), span=s.faceD/20*2.2;
  let g=null; /* 進行中の操作 */
  const toData=ev=>{const r=svg.getBoundingClientRect();return {x:vb.x+(ev.clientX-r.left)/r.width*vb.w,y:-(vb.y+(ev.clientY-r.top)/r.height*vb.h),k:vb.w/r.width,inside:ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom}};
  const showLens=()=>{if(!g||g.lens)return;g.lens=true;lens.classList.add("on");draw()};
  function draw(){
    if(!g) return; const p=g.p, sc=scoreAt(p.x,p.y,s.faceD), c0=scoreAt(p.x,p.y,s.faceD,0), cut=rank(sc)!==rank(c0);

    if(!g.lens) return;
    const lk=span/132, others=[...s.ends.flat(),...A.cur.filter((a,i)=>i!==A.sel)].filter(a=>a.x!=null&&Math.hypot(a.x-p.x,a.y-p.y)<span).map(a=>`<circle cx="${a.x}" cy="${-a.y}" r="${ARROW_R}" fill="${dotFill(a,s.faceD)}" opacity=".45"/>`).join("");
    const gp=ARROW_R+3*lk, ln=span*0.2;
    lensSvg.setAttribute("viewBox",`${p.x-span/2} ${-p.y-span/2} ${span} ${span}`);
    lensSvg.innerHTML=`<rect x="${p.x-span}" y="${-p.y-span}" width="${span*2}" height="${span*2}" fill="#8b949e"/>${face}${others}<circle cx="${p.x}" cy="${-p.y}" r="${ARROW_R}" fill="${f}"/>`+
      [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>`<path d="M${p.x+dx*gp} ${-p.y+dy*gp}L${p.x+dx*(gp+ln)} ${-p.y+dy*(gp+ln)}" stroke="#ffffff" stroke-width="3.5" vector-effect="non-scaling-stroke"/><path d="M${p.x+dx*gp} ${-p.y+dy*gp}L${p.x+dx*(gp+ln)} ${-p.y+dy*(gp+ln)}" stroke="#10151b" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join("");

  }
  svg.addEventListener("pointerdown",ev=>{
    if(g) return; ev.preventDefault();
    const full=A.cur.length>=s.per, allDone=s.ends.length>=s.endsPlan;

    try{svg.setPointerCapture(ev.pointerId)}catch(_){}
    const d=toData(ev);

  <div class="cond" style="grid-template-columns:1fr"><label><span>B（後）</span><select class="pick" id="cmpB">${list.map(x=>sessOpt(x,B.id)).join("")}</select></label></div>
  <section class="sec" style="margin-top:12px">
    ${sameCond?`<p class="basis" style="padding:0 0 8px">条件は同じです（${condLabel(A)}、${setupName(A.setupId)}）。</p>
    <div class="cmp"><div class="cmpRow h"><div></div><div>A ${md(A.date)}</div><div>B ${md(B.date)}</div><div>B − A</div></div>
      ${r("合計",total(A),total(B))}${r("前半",halfTot(A,0),halfTot(B,0))}${r("後半",halfTot(A,1),halfTot(B,1))}${r("10+X",tens(flat(A)),tens(flat(B)))}${r("X",xs(flat(A)),xs(flat(B)))}
      ${r("グループRMS cm",gA?gA.rr:null,gB?gB.rr:null,1)}${r("中心のずれ cm",gA?Math.hypot(gA.cx,gA.cy):null,gB?Math.hypot(gB.cx,gB.cy):null,1)}</div>`:
    `<div class="empty" style="border-top:1px solid var(--rule)"><b>条件が違うため、合計は並べていません</b>A: ${condLabel(A)}<br>B: ${condLabel(B)}<br>距離・的・射数が同じ練習を選ぶと比較表を表示します。</div>`}
  </section>
  ${sameCond?`<div class="pair" style="margin-top:14px">${mini(A,gA,"A")}${mini(B,gB,"B")}</div>
  <section class="sec" style="margin-top:0">
    <p class="fact">合計の差は ${sgn(diff)} 点です。同じ条件 ${tvAll.length}回の回ごとの標準偏差は ${f1(d)} 点で、差は${Math.abs(diff)<=d?"その範囲内":Math.abs(diff)<=2*d?"その1〜2倍":"その2倍を超える値"}です。</p>
    ${gA&&gB?`<p class="fact">着弾中心は A が ${offTxt(gA)}、B が ${offTxt(gB)} です。</p>`:""}
    <p class="basis">1回ずつの比較です。下の変更が原因とは断定できません。</p>
  </section>
  <section class="sec"><div class="secH"><h2>この間の変更とメモ</h2><span class="aside">${md(lo)}〜${md(hi)}</span></div>
    ${chg.length?chg.map(c=>row(md(c.date),c.text)).join(""):`<p class="basis">弓具の変更記録はありません。</p>`}
    ${[A,B].filter(s=>s.note).map(s=>`<div class="row" style="align-items:flex-start"><span class="k">${md(s.date)}</span><span class="v" style="font-weight:400;font-size:15px;text-align:left;flex:1;line-height:1.6">${esc(s.note)}</span></div>`).join("")}
  </section>`:""}
  </main>${tabbar("analysis")}`;
}
function scrAnForm(){
  const recs=[["2026-11-10","引き手の肘の高さ","動画 2本・70m の記録に添付"],["2026-10-21","リリース後の引き手の動き","動画 1本"],["2026-10-03","押し手の肩","写真 3枚"]];
  return `<main class="scr">${anHead("form")}
  <section class="sec" style="margin-top:16px"><div class="secH"><h2>射型の記録</h2><span class="aside">${recs.length}件</span></div>
    ${recs.map(r=>linkRow("#analysis-form",r[1],mdw(r[0])+"・"+r[2])).join("")}
    <div class="btnRow"><button class="btn">撮影して記録する</button><button class="btn">並べて見る</button></div>
    <p class="basis" style="padding-top:12px">動画と写真はこの端末の中だけに保存します。姿勢の自動判定は補助の目安で、点数との関係は断定しません。</p>
  </section>
  <section class="sec"><div class="secH"><h2>外れた理由のメモ</h2><span class="aside">直近90日・自分で付けた印</span></div>
    ${row("リリース","7回")}${row("押し手","4回")}${row("風","3回")}
    <p class="basis">記録中に矢を選んで付けた印の集計です。印を付けた矢だけが対象です。</p>
  </section></main>${tabbar("analysis")}`;
}

/* ---------- ノート ---------- */
const nt={filter:"all"};
function noteEntries(list){
  return list.map(x=>{
    const d=dOf(x.date), isS=!!x.ends, chg=DB.gearLog.filter(g=>g.date===x.date);
    return `<button class="entry" data-go="${isS?"#note/"+x.id:"#notes"}"><div class="day">${d.getDate()}<small>${WD[d.getDay()]}曜</small></div><div>
      ${isS?`<div class="hd"><b>${x.dist}m・${shots(x)}射</b><span class="sc1">${total(x)}<small>点</small></span></div><div class="meta">${x.faceD}cm的・${setupName(x.setupId)}・${x.weather}${x.inputMode==="key"?"・点数だけ":""}</div>`:`<div class="hd"><b>メモ</b></div>`}
      ${x.note||x.text?`<div class="txt">${esc(x.note||x.text)}</div>`:""}
      ${chg.map(c=>`<div class="chg">弓具の変更: ${esc(c.text)}</div>`).join("")}</div></button>`}).join("");
}
function scrNotes(){
  let items=[...done(),...DB.notes].sort(byDateDesc);
  if(nt.filter==="rec") items=items.filter(x=>x.ends); if(nt.filter==="memo") items=items.filter(x=>x.note||x.text); if(nt.filter==="70") items=items.filter(x=>x.dist===70);
  const fb=(k,n)=>`<button aria-pressed="${nt.filter===k}" data-nf="${k}">${n}</button>`;
  let h="",cm="";
  items.forEach(x=>{const d=dOf(x.date),m=d.getFullYear()+"年"+(d.getMonth()+1)+"月";if(m!==cm){cm=m;const n=items.filter(y=>y.date.slice(0,7)===x.date.slice(0,7)&&y.ends).length;h+=`<h2 class="month" style="display:flex;justify-content:space-between;align-items:baseline"><span>${m}</span><span style="font-size:14px;font-weight:500;color:var(--sub)">練習 ${n}回</span></h2>`}h+=noteEntries([x])});
  return `<main class="scr"><header class="top"><h1>ノート</h1><button class="txtBtn">メモを書く</button></header>
  <div style="padding:0 var(--gut)"><div class="seg">${fb("all","すべて")}${fb("rec","練習")}${fb("memo","メモあり")}${fb("70","70m")}</div></div>
  ${h||`<div style="padding:0 var(--gut)"><div class="empty"><b>該当する記録はありません</b></div></div>`}
  <div style="padding:0 var(--gut);margin-top:18px"><button class="row link" data-noop style="border-top:1px solid var(--rule)"><span class="main"><b>ゴミ箱</b><span>${DB.trash}件。ここから元に戻せます</span></span><span class="v">${ICON.go}</span></button></div>
  </main>${tabbar("notes")}`;
}
function scrNote(id){
  const s=DB.sessions.find(x=>x.id===id)||DB.sessions.find(x=>x.id==="a7"), a=flat(s), g=group(pos(s)), px=Math.min(innerWidth,480), mk=DB.marks.find(m=>m.dist===s.dist);
  return `<main class="scr" style="padding-bottom:40px"><div style="border-bottom:1px solid var(--rule)"><button class="backBtn" data-go="#notes">${ICON.back}ノート</button></div>
  <header class="top"><div><div class="date">${dOf(s.date).getFullYear()}年</div><h1>${mdw(s.date)}　${s.dist}m</h1></div><div class="big" style="font-size:36px">${total(s)}</div></header>
  <section class="sec" style="margin-top:6px"><div class="secH"><h2>メモ</h2><button class="txtBtn" style="min-height:32px">書き直す</button></div>
    <p class="fact" style="padding-top:4px">${s.note?esc(s.note):'<span style="color:var(--sub)">メモはありません。</span>'}</p>
    ${s.tags&&s.tags.length?`<div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
  </section>
  <section class="sec"><div class="secH"><h2>スコア表</h2><span class="aside">10+X ${tens(a)}・X ${xs(a)}</span></div></section>
  ${scorecard(s)}
  <section class="sec"><div class="secH"><h2>着弾</h2><span class="aside">${g?`RMS ${f1(g.rr)}cm・中心 ${offTxt(g)}`:"位置の記録なし"}</span></div></section>
  ${g?`<div class="tgWrap">${plotSvg(s,px)}</div>`:`<div style="padding:0 var(--gut)"><div class="empty"><b>着弾データなし</b>点数だけで記録した練習です。</div></div>`}
  <section class="sec"><div class="secH"><h2>条件</h2></div>
    ${row("ラウンド",`${s.dist}m・${s.faceD}cm的`,`${s.per}射 × ${s.endsPlan}エンド`)}${row("弓具",setupName(s.setupId),"矢の外径 5.7mm で判定")}${row("サイト",mk?f2(mk.v):"記録なし")}${row("天気・風",`${s.weather}・風 ${s.wind}`)}${row("入力",s.inputMode==="key"?"点数だけ":"的面に打つ")}
  </section>
  <section class="sec"><div class="secH"><h2>この記録の操作</h2></div>
    ${linkRow("#analysis-compare","ほかの練習と比べる","")}<button class="row link" data-noop><span class="main"><b>点数や位置を直す</b><span>記録中と同じ画面で直します。直した矢には印が付きます</span></span><span class="v">${ICON.go}</span></button>
    <div class="btnRow"><button class="btn danger">ゴミ箱へ移す</button></div><p class="basis" style="padding-top:8px">ゴミ箱に移した記録は、ノートの一番下から元に戻せます。</p>
  </section></main>`;
}

/* ---------- 弓具・サイト ---------- */
function gearHead(cur){return `<header class="top"><h1>弓具</h1></header><div class="utabs"><button data-go="#gear" ${cur==="gear"?'aria-current="page"':""}>セッティング</button><button data-go="#sight" ${cur==="sight"?'aria-current="page"':""}>サイト</button></div>`}
function scrGear(){
  const s=DB.setups[0];
  return `<main class="scr">${gearHead("gear")}
  <section class="sec" style="margin-top:16px"><div class="secH"><h2>${s.name}<span class="pill on">記録に使用中</span></h2><button class="txtBtn" style="min-height:32px">編集</button></div>
    ${s.spec.map(p=>row(p[0],p[1])).join("")}
  </section>
  <section class="sec"><div class="secH"><h2>変更の履歴</h2><span class="aside">${DB.gearLog.length}件</span></div>
    ${DB.gearLog.map(g=>row(mdw(g.date),g.text)).join("")}
    <p class="basis">変更した日は、ノートと比較の画面にも表示します。</p>
  </section>
  <section class="sec"><div class="secH"><h2>ほかのセッティング</h2></div>
    ${DB.setups.slice(1).map(x=>linkRow("#gear",x.name,x.spec.map(p=>p[1].split("（")[0]).slice(0,2).join("・"))).join("")}
    <div class="btnRow"><button class="btn">セッティングを追加</button></div>
  </section></main>${tabbar("gear")}`;
}
function sightScale(){
  const W=112,H=330,T=16,B=16,lo=0,hi=7,Y=v=>T+(v-lo)/(hi-lo)*(H-T-B);
  let h=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="サイトの目盛りと各距離の位置"><path d="M34 ${T}V${H-B}" stroke="var(--ink)" stroke-width="2"/>`;
  for(let v=lo;v<=hi+1e-9;v+=0.2){const major=Math.abs(v-Math.round(v))<1e-6,half=Math.abs(v*2-Math.round(v*2))<1e-6;h+=`<path d="M34 ${Y(v)}h${major?-14:half?-9:-5}" stroke="var(${major?"--ink":"--rule-strong"})" stroke-width="${major?1.5:1}"/>`;if(major)h+=`<text class="ax" x="14" y="${Y(v)+4.5}" text-anchor="end">${Math.round(v)}</text>`}
  DB.marks.forEach(m=>{const p=m.kind==="予測";h+=`<path d="M34 ${Y(m.v)}H58" stroke="var(${p?"--sub":"--accent"})" stroke-width="2" ${p?'stroke-dasharray="4 3"':""}/><path d="M36 ${Y(m.v)}l8 -5v10z" fill="var(${p?"--sub":"--accent"})"/><text x="62" y="${Y(m.v)+5}" font-size="14" font-weight="700" fill="var(--ink)">${m.dist}m</text>`});
  return h+"</svg>";
}
function scrSight(){
  const s=done().filter(x=>x.dist===70&&pos(x).length).sort(byDateDesc)[0], g=group(pos(s)), se=Math.hypot(g.sx,g.sy)/Math.sqrt(2*g.n)*1, sex=g.sx/Math.sqrt(g.n), sey=g.sy/Math.sqrt(g.n);
  const sigX=Math.abs(g.cx)>2*sex, sigY=Math.abs(g.cy)>2*sey, cmPer=6.4;
  return `<main class="scr">${gearHead("sight")}
  <div class="cond" style="margin-top:0"><label><span>セッティング</span><select class="pick">${DB.setups.map(x=>`<option>${x.name}</option>`).join("")}</select></label><label><span>目盛りの向き</span><select class="pick"><option>大きいほど下</option></select></label></div>
  <section class="sec" style="margin-top:14px"><div class="secH"><h2>サイト台帳</h2><span class="aside">上下の値</span></div>
    <div class="sightGrid"><div style="padding-top:6px">${sightScale()}</div><div>
      ${DB.marks.slice().reverse().map(m=>`<div class="row" style="min-height:64px"><span class="k" style="color:var(--ink);font-weight:700;font-size:17px">${m.dist}m</span><span class="v" style="font-size:24px;font-weight:700;line-height:1.2">${f2(m.v)}<small>${m.kind==="予測"?"予測（実測2点から）":md(m.date)+" 実測"}</small></span></div>`).join("")}
      <p class="basis">左右は全距離 0.0 です。</p>
    </div></div>
    <div class="btnRow"><button class="btn pri">サイト値を記録</button><button class="btn">校正する</button></div>
  </section>
  <section class="sec"><div class="secH"><h2>調整の目安</h2><span class="aside">70m・${mdw(s.date)}</span></div>
    <div class="figs two"><div class="fig"><div class="l">左右</div><div class="n" style="font-size:24px">${sigX?(g.cx<0?"右へ ":"左へ ")+f1(Math.abs(g.cx)/cmPer)+"目盛":"動かさない"}</div><div class="d">着弾中心 ${g.cx<0?"左":"右"} ${f1(Math.abs(g.cx))}cm</div></div><div class="fig"><div class="l">上下</div><div class="n" style="font-size:24px">${sigY?(g.cy<0?"下げる ":"上げる ")+f1(Math.abs(g.cy)/cmPer)+"目盛":"動かさない"}</div><div class="d">着弾中心 ${g.cy<0?"下":"上"} ${f1(Math.abs(g.cy))}cm</div></div></div>
    <p class="fact">着弾中心は ${offTxt(g)} です（位置のある ${g.n}射）。平均位置の標準誤差は左右 ${f1(sex)}cm・上下 ${f1(sey)}cm です。</p>
    <p class="basis">ずれが標準誤差の2倍を超える方向だけ、目盛りに換算しています。換算は校正値（70m で 1目盛 = 約 ${cmPer}cm、10/3 に校正）によります。風のあった日の左右は、風の影響を含みます。</p>
  </section>
  <section class="sec"><div class="secH"><h2>記録していない距離の予測</h2></div>
    ${row("50m","3.84","30m 2.60 と 70m 5.20 の実測から")}${row("60m","4.51","同上")}
    <p class="basis">実測が2点のため、矢速の仮定に左右されます。初回は必ず実射で確かめてください。</p>
  </section></main>${tabbar("gear")}`;
}

/* ---------- 設定 ---------- */
function scrSettings(){
  const seg=(key,opts)=>`<div class="seg" style="min-width:164px">${opts.map(o=>`<button aria-pressed="${String(settings[key])===String(o[0])}" data-set="${key}" data-val="${o[0]}">${o[1]}</button>`).join("")}</div>`;
  const sr=(k,ctl,sub)=>`<div class="row" style="flex-wrap:wrap"><span class="main"><b>${k}</b>${sub?`<span>${sub}</span>`:""}</span>${ctl}</div>`;
  return `<main class="scr" style="padding-bottom:40px"><div style="border-bottom:1px solid var(--rule)"><button class="backBtn" data-go="#home">${ICON.back}記録</button></div>
  <header class="top"><h1>設定</h1></header>
  <section class="sec" style="margin-top:6px"><div class="secH"><h2>表示</h2></div>
    ${sr("テーマ",seg("theme",[["dark","ダーク"],["light","ライト"]]),"端末の設定に合わせることもできます")}
    ${sr("射場モード",seg("field",[["false","切"],["true","入"]]),"日光の下で読めるよう、濃淡の差を大きくします")}
    ${sr("拡大鏡の位置",seg("lens",[["left","左上"],["right","右上"]]),"記録中は動きません。持ち手の反対側が見やすい位置です")}
  </section>
  <section class="sec"><div class="secH"><h2>記録</h2></div>
    ${linkRow("#settings","自作ラウンド","距離・的・射数の組み合わせを登録します","2件")}
    ${linkRow("#settings","スコア表の並び","確定したエンドを高い点から表示","入")}
    ${sr("練習の目標と連続記録",seg("gamify",[["false","切"],["true","入"]]),"入れると、週の目標と練習日数を記録タブに1行で表示します")}
  </section>
  <section class="sec"><div class="secH"><h2>データ</h2><span class="aside">この端末に保存・9回分</span></div>
    ${linkRow("#settings","バックアップを書き出す","最後の書き出し: 11/10")}${linkRow("#settings","バックアップから読み込む","今の記録に追加します。上書きはしません")}${linkRow("#settings","表計算用に書き出す（CSV）","")}${linkRow("#settings","自動バックアップ","端末内に3世代を保持","入")}${linkRow("#settings","ゴミ箱",DB.trash+"件","")}
    <p class="basis">ブラウザのデータを消去すると記録も消えます。機種変更の前に書き出してください。</p>
  </section>
  <section class="sec"><div class="secH"><h2>アプリ</h2></div>
    ${linkRow("#settings","ホーム画面に追加","")}${row("版","試作 v5")}
  </section></main>`;
}

/* ============================================================ 経路 ============================================================ */
function on(sel,fn){const e=$(sel);if(e)e.onclick=fn}
function render(){
  const app=$("#app"), h=(location.hash||"#home").slice(1), [name,arg]=h.split("/");
  let html,bind=null;
  if(name==="record-target"||name==="record-score"){
    const mode=name==="record-score"?"key":"pos";
    if(!active) active=demoActive(mode);
    active.sess.inputMode=mode;
    if(render.last!==name){active.sel=null;active.edEnd=null;active.scTop=null}
    if(mode==="pos"){html=scrRecTarget();bind=bindRecTarget}
    else{html=scrRecScore();bind=bindRecScore}
  }else{
    html=({home:scrHome,start:scrStart,result:scrResult,"analysis-score":scrAnScore,"analysis-impact":scrAnImpact,"analysis-compare":scrAnCompare,"analysis-form":scrAnForm,notes:scrNotes,note:()=>scrNote(arg),gear:scrGear,sight:scrSight,settings:scrSettings}[name]||scrHome)();
  }
  const keepY=render.last===name?scrollY:0; render.last=name;
  app.innerHTML=html; scrollTo(0,keepY);
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.go}));
  if(bind) bind();
  on("#btnMenu",()=>{app.insertAdjacentHTML("beforeend",menuSheet(active));on("#mClose",()=>$("#ovl").remove());$("#ovl").onclick=e=>{if(e.target.id==="ovl")$("#ovl").remove()};
    on("#mSwitch",()=>{const to=active.sess.inputMode==="key"?"target":"score";active.sel=null;location.hash="#record-"+to});on("#mFinish",finish)});
  $$("[data-round]").forEach(b=>b.onclick=()=>{startSel.round=b.dataset.round;render()});
  $$("[data-mode]").forEach(b=>b.onclick=()=>{startSel.mode=b.dataset.mode;render()});
  on("#btnQuick",()=>{const ref=done().sort(byDateDesc)[0];startSel.round=ref.dist===18?"18m":ref.dist+"m";active=newActive();location.hash="#record-"+(startSel.mode==="key"?"score":"target")});
  on("#btnStart",()=>{active=newActive();location.hash="#record-"+(startSel.mode==="key"?"score":"target")});
  $$("[data-nf]").forEach(b=>b.onclick=()=>{nt.filter=b.dataset.nf;render()});
  $$("[data-set]").forEach(b=>b.onclick=()=>{const k=b.dataset.set,v=b.dataset.val;settings[k]=v==="true"?true:v==="false"?false:v;applyTheme();render()});
  const bindSel=(id,fn)=>{const e=$(id);if(e)e.onchange=()=>{fn(e.value);render()}};
  bindSel("#anCond",v=>an.cond=v);bindSel("#anPeriod",v=>an.period=v);bindSel("#anImpact",v=>an.impact=v);bindSel("#cmpA",v=>an.cA=v);bindSel("#cmpB",v=>an.cB=v);
}
addEventListener("hashchange",render);
addEventListener("resize",()=>{clearTimeout(render.rt);render.rt=setTimeout(render,120)});
render();
</script>
</body>
</html>
